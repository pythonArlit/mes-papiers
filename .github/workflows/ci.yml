name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests du noyau (JVM)
        run: ./gradlew :core:test
      - name: Résumé des tests du noyau
        if: always()
        run: grep -ho '<testsuite [^>]*' core/build/test-results/test/*.xml | sed -E 's/.*name="([^"]*)".*tests="([0-9]*)".*failures="([0-9]*)" errors="([0-9]*)".*/RESUME-NOYAU \1 tests=\2 echecs=\3 erreurs=\4/'
      - name: Lint et tests unitaires de l'application
        run: ./gradlew :app:lintProdRelease :app:testProdDebugUnitTest
      - name: APK de démonstration et APK prod
        run: ./gradlew :app:assembleDemoDebug :app:assembleProdRelease
      - name: Contrôle de l'APK prod (permissions, débogage, absence de démo)
        run: |
          export PATH="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1):$PATH"
          tools/check-apk.sh app/build/outputs/apk/prod/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk-demo
          path: app/build/outputs/apk/demo/debug/*.apk

  appareil:
    name: Tests instrumentés (émulateur Android 14)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Accélération matérielle (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests sur émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          profile: pixel_6
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 0
            ./gradlew :app:connectedDemoDebugAndroidTest
            mkdir -p app/build/kept && cp -r app/build/outputs/androidTest-results app/build/kept/androidTest-results-principal
            ./gradlew :app:connectedDemoDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=app.mespapiers.ScreenshotTour -Pandroid.testInstrumentationRunnerArguments.tour=1 || true
            adb pull /sdcard/Download/mespapiers captures || true
      - name: Résumé des tests instrumentés
        if: always()
        run: find app/build -name '*.xml' -path '*androidTest-results*' -exec grep -ho 'testsuite name="[^"]*" tests="[0-9]*" failures="[0-9]*"' {} + | sed 's/^/RESUME-APPAREIL /' || find app/build -name '*.xml' | grep -i test | head
      - name: Détail d'un échec de la visite guidée
        if: always()
        run: grep -rh -A14 '<failure' app/build/outputs/androidTest-results | head -45 || true
      # Captures d'écran de la variante demo (données fictives), publiées sur la branche « captures ».
      - name: Publie les captures d'écran
        if: always()
        run: |
          [ -d captures ] && ls captures | grep -q png || { echo "aucune capture"; exit 0; }
          cd captures
          git init -q -b captures
          git config user.name "CI Mes Papiers"
          git config user.email "ci@mespapiers.invalid"
          git add -A
          git commit -qm "Captures d'écran de la démo (données fictives) pour $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" captures
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests-instrumentes
          path: app/build/reports/androidTests/
